# ==============================================================================
# LOCAL INFRASTRUCTURE ORCHESTRATION (Docker Compose)
# ==============================================================================
# This file defines and coordinates the containers for the Geo-Yield-AI
# project. It follows the separation-of-concerns principle:
# 1. Data layer (postgis): relational, spatial and vector storage.
# 2. Logic layer (api): FastAPI backend.
# ==============================================================================

services:

  postgis:
    # Design decision (custom build):
    # Instead of using the official prebuilt image, we build our own based on
    # deployment/Dockerfile.postgis. This lets us unify PostgreSQL, PostGIS
    # (spatial data) and pgvector (AI/RAG engine) in a single database engine,
    # optimizing resources.
    build:
      context: ..
      dockerfile: deployment/Dockerfile.postgis
    container_name: geoyield_db
    # Restart policy: the container survives machine restarts, but respects
    # the developer stopping it manually with 'stop'.
    restart: unless-stopped
    # Secrets and variable management:
    # We use a single .env file at the repo root as the single source of
    # truth. Technical note: we avoid using the 'environment:' block here
    # because Docker Compose would try to interpolate the variables early
    # (leaving them empty) and would overwrite the correct values injected by
    # 'env_file'.
    env_file:
      - ../.env  # Single .env at the repo root (previously there was ambiguity between one in deployment/ and one at the root)
    # NOTE (a real bug, caught at runtime): there is no extra
    # "environment: POSTGRES_DB: ${POSTGRES_DB}..." block declared here.
    # Docker Compose interpolates ${VAR} while parsing the YAML using the
    # .env of the compose file's OWN directory (deployment/), NOT the one in
    # env_file (../.env) -- since there is no .env there, those variables
    # resolve to empty strings, and because "environment:" takes precedence
    # over "env_file:", they overwrote the correct values that env_file had
    # already injected properly. Result: POSTGRES_PASSWORD arrived empty at
    # the container and Postgres refused to start. env_file alone is already
    # enough to pass these variables to the container -- there is no need to
    # duplicate them.
    # Published to the host (not just 'expose') so Alembic and the ETL can be
    # run from outside Docker during development (see README, Phase 1).
    # A deliberate trade-off for a local development environment: in a real
    # deployment this should not be published to the host.
    # Honours POSTGRES_HOST_PORT from the root .env, so a Postgres already
    # running on the host does not block startup. Interpolation reads the
    # .env of the compose file's directory, so run compose with
    # `--env-file .env` from the repo root (see README).
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
    # Data persistence:
    # Specific adjustment for official images from PostgreSQL 18 onward: the
    # volume must be mounted at the parent directory (/var/lib/postgresql),
    # since the image manages the per-version subfolders internally.
      - geoyield_db:/var/lib/postgresql
    networks:
      - geoyield_net
    # Health check:
    # Ensures the database is ready to accept TCP connections before the API
    # tries to start.
    # Technical note: we use double dollar ($$) to stop Compose from
    # evaluating the variable while reading the YAML; we want it evaluated by
    # the shell INSIDE the container using the values from the .env file.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: geoyield_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - geoyield_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      # The build 'context' is set to the repo root ('..') so the Dockerfile
      # can access the /backend folder and copy the application's source
      # code.
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: geoyield_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DB_HOST_OVERRIDE=
      - DB_PORT_OVERRIDE=
    # Port mapping to avoid collisions:
    # The API runs internally on port 8000, but we expose it on 8080 to avoid
    # conflicting with other local applications on the host.
    ports:
      - "8080:8000"
    volumes:
      # Mount the local data folder inside the container 
      # so that the API can access the CSV files in Phase 1 (until they are migrated to S3)
      - ../data:/app/data
      # RAG evaluation results (runs/*.json, corpus.json). They are generated outside the server and copied
      # here (not in git); the API reads them from /app/evals/results (backend/api/routers/rag_evals.py)
      # and the /metrics "Calidad RAG" tab shows them. Mounted from the host so a redeploy does not lose them.
      - ../evals/results:/app/evals/results
      - ~/.aws:/root/.aws
    # No log volume any more: logs go to stdout as JSON (one line per event),
    # which is what both `docker compose logs` and the awslogs driver collect.
    # A file inside the container reaches no collector.
    #   docker compose logs -f api | jq .
    #
    # On EC2 nothing ships stdout to CloudWatch unless we ask the Docker daemon
    # to (the default json-file driver stays on the box). The daemon uses the
    # instance profile (see aws/bedrock/bedrock-policy.json), so no keys.
    # non-blocking: a CloudWatch outage drops buffered lines instead of
    # stalling the API on every log call.
    # Because the awslogs driver ships stdout, the app's own watchtower
    # shipping must stay off here (leave LOG_CLOUDWATCH_GROUP unset), or every
    # line is ingested twice.
    logging:
      driver: awslogs
      options:
        awslogs-region: "${AWS_REGION:-eu-central-1}"
        awslogs-group: "${LOG_CLOUDWATCH_DOCKER_GROUP:-/geoyield/api}"
        awslogs-create-group: "true"
        tag: "{{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
    networks:
      - geoyield_net
    # Startup dependency:
    # Thanks to the 'condition: service_healthy' block, Docker patiently waits
    # for the database to confirm it's operational before starting the API.
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

# ==============================================================================
# DOCKER-MANAGED RESOURCES
# ==============================================================================

# Named volumes:
# Persistence is delegated to the Docker engine instead of mapping OS folders
# (bind mounts), avoiding permission issues (especially between
# Linux/Windows/macOS).
volumes:
  geoyield_db:

# Internal network (bridge):
# Isolates communication between containers, letting them discover each other
# via automatic DNS resolution (using service names: 'postgis').
networks:
  geoyield_net:
    driver: bridge