services:

  postgis:
    # Imagen oficial de PostGIS: incluye PostgreSQL + extensión PostGIS, lista
    # para datos geoespaciales sin configuración adicional. pgvector (motor
    # RAG) se instalará como extensión adicional sobre esta misma
    # base de datos — no hace falta un segundo servicio.
    image: postgis/postgis:18-master
    container_name: geoyield_db
    env_file:
      - ../.env  
      # .env único en la raíz del repo (antes había ambigüedad entre uno en deployment/ y otro en la raíz)
    ports:
      - "5432:5432"
    volumes:
      - geoyield_db:/var/lib/postgresql
    networks:
      - geoyield_net
    # Da un periodo de gracia de 30s y hasta 5 reintentos (cada 10s) antes de
    # declarar la base de datos 'unhealthy', para que la api no intente
    # conectar antes de que Postgres esté listo para aceptar conexiones.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: geoyield_api
    env_file:
      - ../.env
    ports:
      - "8080:8000"
    volumes:
      - geoyield_logs:/app/backend/api/logs
    networks:
      - geoyield_net
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  geoyield_db:
  geoyield_logs:

networks:
  geoyield_net:
    driver: bridge