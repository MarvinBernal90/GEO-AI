  # ==============================================================================
  # LINT Y FORMATO DEL FRONTEND
  # ==============================================================================
  # Corre en paralelo al job Python. Falla el PR si ESLint encuentra errores o
  # si algún archivo no cumple el formato de Prettier.
  frontend-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # ==============================================================================
  # LINT Y FORMATO DEL BACKEND
  # ==============================================================================
  # Corre en paralelo al resto de jobs. Solo instala Ruff (requirements-dev.txt),
  # no las dependencias pesadas del backend (torch, sentence-transformers...).
  # Falla el PR si `ruff check` encuentra errores o si `ruff format` cambiaría
  # algún archivo. La configuración está en pyproject.toml.
  backend-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Ruff
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend

      - name: Check formatting
        run: ruff format --check backend
